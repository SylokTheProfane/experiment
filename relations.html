body::after {

    inset: 0;

/* =========================================================
   GLITCH SYSTEM
   ========================================================= */

.glitch {

    position: relative;

    animation: tremor 7s infinite;
}


.glitch::before,
.glitch::after {

    content: attr(data-text);

    position: absolute;

    inset: 0;

    pointer-events: none;

    overflow: hidden;
}


.glitch::before {

    color: #ff003c;

    transform: translate(2px,0);

    clip-path: inset(10% 0 65% 0);

    animation:
        glitchRed
        3.5s
        infinite
        steps(1);
}


.glitch::after {

    color: var(--cyan);

    transform: translate(-2px,0);

    clip-path: inset(65% 0 12% 0);

    animation:
        glitchBlue
        2.8s
        infinite
        steps(1);
}


@keyframes glitchRed {

    0%, 86%, 100% {
        clip-path: inset(10% 0 65% 0);
    }

    87% {
        clip-path: inset(40% 0 30% 0);
    }

    89% {
        clip-path: inset(5% 0 80% 0);
    }

    91% {
        clip-path: inset(70% 0 5% 0);
    }
}


@keyframes glitchBlue {

    0%, 82%, 100% {
        clip-path: inset(65% 0 12% 0);
    }

    83% {
        clip-path: inset(15% 0 60% 0);
    }

    86% {
        clip-path: inset(75% 0 2% 0);
    }

    88% {
        clip-path: inset(35% 0 35% 0);
    }
}


@keyframes tremor {

    0%, 96%, 100% {
        transform: translate(0);
    }

    97% {
        transform: translate(-1px,1px);
    }

    98% {
        transform: translate(1px,-1px);

}
